[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-agent"
version = "0.2.0"
description = "Knowledge-guided LLM that turns natural-language 6G service intents into validated service profiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
intent-agent = "cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["config", "bootstrap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eval.dataset" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "ollama: needs a running Ollama server with the configured model (skipped otherwise)",
]
